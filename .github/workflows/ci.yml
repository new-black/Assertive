name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 11 preview matches global.json; 8.0 supplies the runtime the net8.0 test
          # target executes on.
          dotnet-version: |
            8.0.x
            11.0.x
          dotnet-quality: preview

      - name: Use the .NET 11 preview SDK
        # The repo's global.json pins the stable SDK for local builds; building with
        # the 11 preview SDK adds the net11.0 test target (escape-analysis coverage).
        run: |
          cat > global.json <<'EOF'
          {
            "sdk": {
              "version": "11.0.100-preview.5",
              "allowPrerelease": true,
              "rollForward": "latestFeature"
            }
          }
          EOF

      - name: Build and Test
        run: bash ./scripts/ci.sh
