name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          # 11 preview matches global.json; 8.0 supplies the runtime the net8.0 test
          # target executes on.
          dotnet-version: |
            8.0.x
            11.0.x
          dotnet-quality: preview

      - name: Use the .NET 11 preview SDK
        # The repo's global.json pins the stable SDK for local builds; building with
        # the 11 preview SDK adds the net11.0 test target (escape-analysis coverage).
        run: |
          cat > global.json <<'EOF'
          {
            "sdk": {
              "version": "11.0.100-preview.5",
              "allowPrerelease": true,
              "rollForward": "latestFeature"
            }
          }
          EOF

      - name: Install Native AOT prerequisites
        # Native AOT publish (the AOT smoke projects) needs the clang toolchain and zlib headers.
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Build and Test
        run: bash ./scripts/ci.sh
